<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Ansar - Basic Web Page</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="fav.ico">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 30px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Abdullah Ansar</h1>
        <p>Basic Web Development</p>
    </header>

    <main>
        <h2>Welcome to My Web Page</h2>
        <p>
            Hello! My name is Abdullah Ansar.
            This is my basic HTML and CSS webpage.
        </p>
        <p>
            I am learning the basics of web development using HTML and CSS.
        </p>
    </main>

    <footer>
        <p>&copy; 2026 Abdullah Ansar</p>
    </footer>

</body>
</html>
